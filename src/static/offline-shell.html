<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1976d2">
    <meta name="referrer" content="no-referrer">
    <title>ListR · Read-only offline view</title>
    <script>
      try {
        if (localStorage.getItem('listapp_theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (_) { /* The saved theme is optional. */ }
    </script>
    <link rel="stylesheet" href="/static/offline-shell.css">
    <script defer src="/static/offline-storage.js"></script>
    <script defer src="/static/offline-shell.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <span class="logo" aria-label="ListR"><strong>List</strong><strong>R</strong></span>
        <h1 id="room-name">Saved lists</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">◐</button>
      </header>
      <main>
        <div class="notice" role="status" aria-live="polite">
          <span class="signal" aria-hidden="true">◌</span>
          <div><p id="status">Checking room access and saved copy…</p><p id="last-saved"></p></div>
        </div>
        <section id="lists" aria-label="Saved lists"></section>
      </main>
    </div>
  </body>
</html>
