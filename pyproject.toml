[project]
name = "list-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.135.0",
    "python-dotenv>=1.2.2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ty>=0.0.63",
    "cairosvg>=2.9.0",
    "pytest-xdist>=3.8.0",
    "playwright>=1.63.0",
    "httpx2>=2.13.1",
    "zensical>=0.0.73",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]
addopts = "-n 8"
markers = [
    "tier_fast: Python feedback suite (not a measured per-test speed promise)",
    "tier_smoke: four critical browser journeys on every existing engine",
    "tier_full: every collected pytest case, including Android when requested",
    "layer_python: Python tests",
    "layer_api: API tests",
    "layer_database: database and migration tests",
    "layer_service: Python rules and services",
    "layer_tool: process and tool tests",
    "layer_browser: real desktop-browser tests",
    "layer_android: Android emulator tests",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "C4",
    "SIM",
    "RUF",
    "BLE",
    "FAST",
    "ASYNC210",
    "ASYNC230",
    "ASYNC251",
]

[tool.ruff.format]
preview = false

[tool.ty.src]
include = ["src"]
