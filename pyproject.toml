[project]
name = "list-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "nicegui>=3.10.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ty>=0.0.32",
    "cairosvg>=2.9.0",
    "pytest-xdist>=3.8.0",
    "playwright>=1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n 8"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "C4",
    "SIM",
    "RUF",
    "BLE",
]

[tool.ruff.lint.per-file-ignores]
# main intentionally performs startup setup before importing application modules.
"src/main.py" = ["E402"]

[tool.ruff.format]
preview = false
