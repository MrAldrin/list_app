[project]
site_name = "ListR documentation"
site_url = "http://localhost:8000/"
docs_dir = "."
site_dir = "site"

# Keep the authoritative root architecture and maintained Markdown sources in
# the preview without copying the architecture into docs/ or copying app code.
# Include root guides, docs/plans Markdown, frontend README and named specs.
# Do not include other files in specs/.
exclude_docs = '''
**
!/docs/*.md
!/docs/**/*.md
/docs/local-network-testing.md
/docs/background/**
!/plans/*.md
!/plans/**/*.md
!/frontend/
/frontend/**
**/README.md
**/AGENTS.md
**/ARCHITECTURE.md
**/.*
**/.*/**
**/local_only/**
!/README.md
!/AGENTS.md
!/ARCHITECTURE.md
!/specs/README.md
!/specs/admin-invitations.allium
!/specs/install-paths.allium
!/specs/item-operations.allium
!/specs/public-sharing.allium
!/specs/reminder-settings.allium
!/specs/room-access.allium
!/specs/sync-offline.allium
!/specs/tags-visibility.allium
!/frontend/README.md
**/*.db
**/*-pre-migration.db*
**/*.sqlite*
'''

nav = [
  { "Documentation" = "docs/index.md" },
  { "Architecture" = "ARCHITECTURE.md" },
  { "Using ListR" = [
    { "Public sharing" = "docs/public-sharing.md" },
    { "Room invitations" = "docs/room-invitations.md" },
    { "Offline use" = "docs/offline-viewing.md" },
    { "Change tracking" = "docs/change-tracking.md" },
    { "Item writes" = "docs/item-writes.md" },
    { "Adding items" = "docs/adding-items.md" },
    { "Checked-item visibility" = "docs/checked-item-visibility.md" },
    { "Item sorting" = "docs/item-sorting.md" },
    { "Due-date reminders" = "docs/due-date-reminders.md" },
    { "Home-screen installation" = "docs/home-screen-installation.md" },
    { "JSON API" = "docs/api.md" },
  ] },
  { "Development and operations" = [
    { "README" = "README.md" },
    { "Development guide" = "docs/development.md" },
    { "Behavior specs" = "specs/README.md" },
    { "Frontend guide" = "frontend/README.md" },
    { "Deployment" = "docs/deployment.md" },
    { "Scope" = "docs/scope.md" },
    { "Preview exclusions" = "docs/preview-exclusions.md" },
    { "Testing guide" = "docs/testing.md" },
    { "Test runtime results" = "docs/reports/test-suite-runtime-2026-11-05.md" },
    { "Browser tests" = "docs/browser-testing.md" },
    { "Android tests" = "docs/android-emulator-testing.md" },
    { "Agent rules" = "AGENTS.md" },
  ] },
  { "Work and proposals" = [
    { "Backlog" = "plans/backlog.md" },
    { "Improvement ideas" = "plans/improvement-ideas.md" },
  ] },
]

[project.theme]
language = "en"
features = ["navigation.footer", "navigation.sections", "navigation.tracking", "navigation.top", "search.highlight"]
font = false

# build_docs_site.py generates redirects from excluded source paths; no file map to maintain.