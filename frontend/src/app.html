<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Links to other sites get no referrer, so share-link addresses do not
		     leak. Not "no-referrer": that also blanks the Origin of our own API
		     writes, which the server checks. -->
		<meta name="referrer" content="same-origin" />
		<!-- Home-screen install, as NiceGUI's pages: the icons are NiceGUI's
		     files, served by Python at /static/ (the dev server forwards them).
		     The manifest link is set per page in routes/+layout.svelte. -->
		<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<!-- The browser's bar color; lib/ui/theme.svelte.ts sets it to the
		     page background of the current mode. -->
		<meta name="theme-color" content="#f4f5f7" />
		<script>
			// Light or dark before the first paint, so the page never flashes
			// the wrong colors. Same rules as lib/ui/theme.ts: a saved choice
			// (NiceGUI's key), else the system's mode.
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('listapp_theme');
				} catch (error) {
					saved = null;
				}
				var dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
