<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Links to other sites get no referrer, so share-link addresses do not
		     leak. Not "no-referrer": that also blanks the Origin of our own API
		     writes, which the server checks. -->
		<meta name="referrer" content="same-origin" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
